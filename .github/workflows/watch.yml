name: Watch Target for Pokémon drops

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: pokedrop-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan Target and post alerts
        id: scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_STORE_ID: ${{ vars.TARGET_STORE_ID || '1357' }}
          TARGET_ZIP: ${{ vars.TARGET_ZIP || '55403' }}
          TARGET_STATE: ${{ vars.TARGET_STATE || 'MN' }}
          WATCH_CATEGORIES: ${{ vars.WATCH_CATEGORIES }}
          WATCH_KEYWORDS: ${{ vars.WATCH_KEYWORDS }}
          TITLE_FILTER: ${{ vars.TITLE_FILTER }}
          DISCOVERY_INTERVAL: ${{ vars.DISCOVERY_INTERVAL || '1800' }}
          STREET_DATE_WARN_HOURS: ${{ vars.STREET_DATE_WARN_HOURS || '48' }}
          REDSKY_KEY: ${{ secrets.REDSKY_KEY }}
          STATE_PATH: state/pokedrop.json
          LOG_LEVEL: INFO
        run: python -m pokedrop scan

      - name: Commit updated state
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name  "pokedrop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pokedrop.json
          git commit -m "state: ${{ steps.scan.outputs.tracked }} SKUs, ${{ steps.scan.outputs.events }} alert(s)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "Could not push state after 3 attempts" >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### PokéDrop run"
            echo ""
            echo "- SKUs tracked: **${{ steps.scan.outputs.tracked || '0' }}**"
            echo "- Alerts sent this run: **${{ steps.scan.outputs.events || '0' }}**"
            echo "- State changed: **${{ steps.scan.outputs.changed || 'false' }}**"
          } >> "$GITHUB_STEP_SUMMARY"
