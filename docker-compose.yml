services:
  pokedrop:
    build: .
    container_name: pokedrop
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/pokedrop.db
    volumes:
      - pokedrop-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pokedrop-data:
